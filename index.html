<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daub: thick-paint wallpaper maker</title>
<meta name="description" content="Turn any image into a palette-knife oil painting wallpaper. Runs entirely in your browser.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500;1,6..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<style>
:root{--wall:#d5d7db;--wall2:#c4c7cd;--panel:#f4f4f2;--ink:#101114;--mute:#666a75;--line:#c8cbd2;--blue:#1b3fd8;--yel:#f2c230;--serif:"Bodoni Moda",Didot,"Bodoni 72",Georgia,serif;--sans:"Hanken Grotesk",-apple-system,system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--wall:#101115;--wall2:#08080b;--panel:#17181d;--ink:#eeeff3;--mute:#8c919d;--line:#2b2d35;--blue:#6f8aff}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:minmax(0,1fr);height:100dvh;overflow:hidden;background:var(--wall);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
.stage{position:relative;display:grid;place-items:center;padding:96px 48px 72px;min-width:0;background:radial-gradient(120% 90% at 50% 40%,var(--wall) 40%,var(--wall2) 100%)}
.brand{position:absolute;top:26px;left:32px;display:flex;align-items:center;gap:12px;color:var(--ink)}
.brand b{font:italic 700 30px/1 var(--serif);letter-spacing:-.01em}
canvas#out{max-width:100%;max-height:100%;border-radius:2px;box-shadow:0 1px 0 #fff6,0 40px 70px -28px #10111499,0 0 0 1px #0001}
#msg{position:absolute;left:32px;bottom:24px;color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.hero{position:absolute;inset:96px 48px 72px;display:grid;place-content:center;justify-items:start;gap:18px;max-width:640px;margin:auto}
.hero h2{margin:0;font:italic 500 clamp(44px,6.4vw,92px)/.98 var(--serif);letter-spacing:-.02em}
.hero h2 .m{display:block;overflow:hidden;padding-bottom:.08em}.hero h2 .l{display:block}
.hero .sm{margin:0;color:var(--mute);max-width:40ch}
.hero .tools{display:flex;gap:10px;flex-wrap:wrap}
.hero h2.on{color:var(--blue)}
button{font:600 14px var(--sans);border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:10px 18px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
button:hover{background:var(--ink);color:var(--panel)}
button.go{background:var(--blue);border-color:var(--blue);color:#fff}button.go:hover{filter:brightness(1.12);background:var(--blue);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.panel{overflow:hidden;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.scroll{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--line) transparent;padding:26px 26px 8px;flex:1}
.group{padding:0 0 22px}.group+.group{border-top:1px solid var(--line);padding-top:20px}
.group h3{margin:0 0 14px;font:italic 500 21px/1 var(--serif)}
.group h3 small{font:400 12px var(--sans);color:var(--mute);font-style:normal;margin-left:8px}
.row{margin:0 0 14px}
label{display:flex;justify-content:space-between;font-weight:500;margin-bottom:2px}
label span{color:var(--mute);font-variant-numeric:tabular-nums;font-weight:400}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--ink);margin-top:-7px}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--ink);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--ink)}
input[type=range]:hover::-webkit-slider-thumb{background:var(--blue);box-shadow:0 0 0 1px var(--blue)}
select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px}
.seg button{border:0;border-radius:999px;padding:7px 0;font-weight:500;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.seg button:hover{background:var(--line);color:var(--ink)}.seg button[aria-pressed=true]:hover{background:var(--ink);color:var(--panel)}
.hint{margin:6px 2px 0;color:var(--mute);font-size:12px}
.actions{display:grid;grid-template-columns:1fr auto;gap:10px;padding:16px 26px 22px;border-top:1px solid var(--line);background:var(--panel)}
@media(max-width:860px){body{grid-template-columns:1fr;grid-template-rows:60vh auto;height:auto;overflow:auto}.stage{padding:84px 20px 56px}.hero{inset:84px 20px 56px}.scroll{overflow:visible}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.dim{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;color:var(--mute)}input[type=number]{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
.stage.zoom{overflow:auto;place-items:safe center}canvas#out{cursor:zoom-in}canvas#out.zoom{max-width:none;max-height:none;cursor:zoom-out}
</style></head><body>

<script>

const $=id=>document.getElementById(id);
const out=$('out'), msg=$('msg');
let src=null, colorC=null, heightC=null, token=0, painted=false;

// ---------- helpers ----------
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const dims=i=>[i.naturalWidth||i.width,i.naturalHeight||i.height];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

// separable box blur (2 passes), returns Float32Array RGBA (alpha untouched)
function blur(d,w,h,r){
  r=Math.max(1,r|0);
  let a=new Float32Array(d.length), b=new Float32Array(d.length);
  for(let i=0;i<d.length;i++)a[i]=d[i];
  const n=2*r+1;
  for(let p=0;p<2;p++){
    for(let y=0;y<h;y++)for(let c=0;c<3;c++){
      const row=y*w*4+c; let s=0;
      for(let x=-r;x<=r;x++)s+=a[row+clamp(x,0,w-1)*4];
      for(let x=0;x<w;x++){b[row+x*4]=s/n; s+=a[row+Math.min(w-1,x+r+1)*4]-a[row+Math.max(0,x-r)*4];}
    }
    for(let x=0;x<w;x++)for(let c=0;c<3;c++){
      const col=x*4+c; let s=0;
      for(let y=-r;y<=r;y++)s+=b[col+clamp(y,0,h-1)*w*4];
      for(let y=0;y<h;y++){a[col+y*w*4]=s/n; s+=b[col+Math.min(h-1,y+r+1)*w*4]-b[col+Math.max(0,y-r)*w*4];}
    }
  }
  return a;
}

// ---------- painting ----------
async function paint(){
  if(!src)return;
  const my=++token; out._shown=0;
  const [iw,ih]=dims(src);
  if($('size').value==='img')$('h').value=Math.round($('w').value*ih/iw);

  if(W*H>24e6){const f=Math.sqrt(24e6/(W*H));W=Math.round(W*f);H=Math.round(H*f);$('w').value=W;$('h').value=H;msg.textContent='Reduced to fit browser memory (24 megapixel limit).'}

  const rand=rng(+$('seed').value*7919);

  // source scaled/cropped to output
  const sc=mk(W,H), sx=sc.getContext('2d');
  const k=Math.max(W/iw,H/ih);
  sx.imageSmoothingQuality='high';
  sx.drawImage(src,(W-iw*k)/2,(H-ih*k)/2,iw*k,ih*k);
  const sd=sx.getImageData(0,0,W,H).data;

  colorC=mk(W,H); heightC=mk(W,H);
  const cc=colorC.getContext('2d'), hc=heightC.getContext('2d');
  // underpainting: very blurred source
  const base=blur(sd,W,H,W*0.012);
  const bi=new ImageData(Uint8ClampedArray.from(base),W,H);
  cc.putImageData(bi,0,0);
  hc.fillStyle='#808080'; hc.fillRect(0,0,W,H);

  const flow=(x,y)=>{const u=x/W*6,v=y/W*6;return Math.sin(u+Math.sin(v*1.3)*1.7)*1.6+Math.cos(v*1.1-u*.6)*1.2};
  const rgb=(r,g,b)=>`rgb(${clamp(r,0,255)|0},${clamp(g,0,255)|0},${clamp(b,0,255)|0})`;
  const gray=v=>{v=clamp(v,0,255)|0;return `rgb(${v},${v},${v})`};

  const U=W/2560;
  const baseSize=W*0.024*bs*(style==='swirl'?0.35:1);
  for(let li=0;li<L;li++){
    const size=Math.max(4*U,baseSize/Math.pow(2,li));
    const bl=blur(sd,W,H,size*0.5);
    const cur=li>0?cc.getImageData(0,0,W,H).data:null;
    const thr=li>0?thr0:-1;
    const step=size*(style==='swirl'?0.9:0.7);
    const pts=[];
    for(let y=step/2;y<H;y+=step)for(let x=step/2;x<W;x+=step)pts.push([x+(rand()-.5)*step,y+(rand()-.5)*step]);
    for(let i=pts.length-1;i>0;i--){const j=(rand()*(i+1))|0;[pts[i],pts[j]]=[pts[j],pts[i]]}
    let i=0;
    const lum=(x,y)=>{const j=(clamp(y|0,0,H-1)*W+clamp(x|0,0,W-1))*4;return bl[j]*.3+bl[j+1]*.59+bl[j+2]*.11};

    const one=([x,y])=>{
      const idx=(clamp(y|0,0,H-1)*W+clamp(x|0,0,W-1))*4;
      let r=bl[idx],g=bl[idx+1],b=bl[idx+2];
      if(cur){const d=(Math.abs(cur[idx]-r)+Math.abs(cur[idx+1]-g)+Math.abs(cur[idx+2]-b))/3;if(d<thr)return}
      const lu=r*.3+g*.59+b*.11; r=lu+(r-lu)*sat; g=lu+(g-lu)*sat; b=lu+(b-lu)*sat;
      let a;
      if(style==='swirl')a=flow(x,y);
      else{
        const s=Math.max(2,size*.35|0);
        const gx=lum(x+s,y)-lum(x-s,y), gy=lum(x,y+s)-lum(x,y-s);
        a=Math.hypot(gx,gy)>3?Math.atan2(gy,gx)+Math.PI/2:flow(x,y)*.5;
      }
      a+=(rand()-.5)*(style==='swirl'?.12:.35);
      const long=style==='swirl'?4:style==='brush'?3:1.9, wide=style==='swirl'?.5:style==='brush'?.7:1;
      const len=size*long*(.8+rand()*.5), wid=size*wide*(.85+rand()*.3);
      const j=(rand()-.5)*16, hv=60+li*22+rand()*75;
      // streaks shared by colour + height
      const n=Math.max(2,(wid/(style==='knife'?4:2.2))|0), st=[];
      for(let q=0;q<n;q++)st.push([(rand()-.5)*wid,-len/2*(.55+rand()*.45),len/2*(.55+rand()*.45),(.8+rand()*1.7)*U,(rand()-.5)*(style==='knife'?14:26),(rand()-.5)*(style==='knife'?24:60)]);
      for(const [ctx,isH] of [[cc,0],[hc,1]]){
        ctx.save();ctx.translate(x,y);ctx.rotate(a);
        ctx.fillStyle=isH?gray(hv):rgb(r+j,g+j,b+j);
        ctx.fillRect(-len/2,-wid/2,len,wid);
        ctx.lineCap='round';
        for(const [o,l0,l1,lw,dc,dh] of st){
          ctx.strokeStyle=isH?gray(hv+dh):rgb(r+j+dc,g+j+dc,b+j+dc);
          ctx.lineWidth=lw*(isH?1.3:1);ctx.beginPath();ctx.moveTo(l0,o);ctx.lineTo(l1,o);ctx.stroke();
        }
        if(isH){ctx.strokeStyle=gray(hv+42);ctx.lineWidth=Math.max(1,wid*.07);
          ctx.beginPath();ctx.moveTo(-len/2,-wid/2);ctx.lineTo(len/2,-wid/2);ctx.moveTo(-len/2,wid/2);ctx.lineTo(len/2,wid/2);ctx.stroke()}
        ctx.restore();
      }
    };
    await new Promise(res=>{
      const tick=()=>{
        if(my!==token)return res();
        const t0=performance.now();
        while(i<pts.length&&performance.now()-t0<14){one(pts[i]);i++}
        msg.textContent=`Painting layer ${li+1} of ${L}: ${Math.round(i/pts.length*100)}%`;
        if(i<pts.length)requestAnimationFrame(tick);else res();
      };tick();
    });
    if(my!==token)return;
    shade(true);               // show progress with lighting
    await new Promise(r=>requestAnimationFrame(r));
  }
  painted=true; msg.textContent=`${W} × ${H} px. Adjust the thickness sliders or save it.`;
  shade();
}

// ---------- lighting (height map -> relief) ----------
let pending=false;
function shadeSoon(){if(pending||!colorC)return;pending=true;requestAnimationFrame(()=>{pending=false;shade()})}
function shade(){
  if(!colorC)return;
  const W=colorC.width,H=colorC.height;
  const cd=colorC.getContext('2d').getImageData(0,0,W,H);
  const hd=heightC.getContext('2d').getImageData(0,0,W,H).data;
  const c=cd.data;
  const sp_=Math.max(1,Math.round(W/2560)), k=+$('relief').value*0.0012/sp_, az=+$('light').value*Math.PI/180, el=+$('elev').value*Math.PI/180;
  const spec=+$('spec').value, tex=+$('tex').value;
  const lx=Math.cos(az)*Math.cos(el), ly=Math.sin(az)*Math.cos(el), lz=Math.sin(el);
  let hx=lx,hy=ly,hz=lz+1;const hl=Math.hypot(hx,hy,hz);hx/=hl;hy/=hl;hz/=hl;
  const h=new Float32Array(W*H);
  for(let i=0;i<W*H;i++){
    const n=(Math.imul(i,2654435761)>>>0)%1000/1000-.5;
    const wv=Math.sin((i%W)*1.7)*Math.sin(Math.floor(i/W)*1.7);   // fine canvas weave
    h[i]=hd[i*4]+(n*8+wv*5)*tex;
  }
  for(let y=sp_;y<H-sp_;y++){
    for(let x=sp_;x<W-sp_;x++){
      const i=y*W+x;
      const nx=-(h[i+sp_]-h[i-sp_])*k, ny=-(h[i+W*sp_]-h[i-W*sp_])*k;
      const inv=1/Math.sqrt(nx*nx+ny*ny+1);
      const diff=(nx*lx+ny*ly+lz)*inv;
      let s=Math.max(0,(nx*hx+ny*hy+hz)*inv);
      s*=s;s*=s;s*=s;s*=s;s*=s;                 // ^32
      const sh=1+(diff-lz)*1.7, sp=s*spec*210, o=i*4;
      c[o]=c[o]*sh+sp;c[o+1]=c[o+1]*sh+sp;c[o+2]=c[o+2]*sh+sp;
    }
  }
  out.hidden=false;$('empty').hidden=true;
  if(!out._shown){out._shown=1;reveal()}
  out.width=W;out.height=H;
  out.getContext('2d').putImageData(cd,0,0);
}

// ---------- input ----------
function setSource(img){src=img;painted=false;paint()}
function loadFile(f){
  if(!f||!f.type.startsWith('image/'))return;
  const img=new Image();img.onload=()=>setSource(img);img.src=URL.createObjectURL(f);
}
$('drop').onclick=()=>$('file').click();
$('drop').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}};
$('file').onchange=e=>loadFile(e.target.files[0]);
['dragover','dragenter'].forEach(t=>addEventListener(t,e=>{e.preventDefault();$('drop').classList.add('on')}));
['dragleave','drop'].forEach(t=>addEventListener(t,e=>{e.preventDefault();$('drop').classList.remove('on')}));
addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
addEventListener('paste',e=>{for(const it of e.clipboardData.items)if(it.type.startsWith('image/'))loadFile(it.getAsFile())});
$('sample').onclick=()=>{
  const c=mk(1600,1000),x=c.getContext('2d');
  let g=x.createLinearGradient(0,0,0,600);g.addColorStop(0,'#1d3fb8');g.addColorStop(1,'#7fd0e8');x.fillStyle=g;x.fillRect(0,0,1600,600);
  g=x.createLinearGradient(0,600,0,1000);g.addColorStop(0,'#0f8fa0');g.addColorStop(1,'#0b3d7a');x.fillStyle=g;x.fillRect(0,540,1600,460);
  x.fillStyle='#f6b13a';x.beginPath();x.arc(1180,330,120,0,7);x.fill();
  x.fillStyle='#b9341f';x.beginPath();x.moveTo(250,700);x.lineTo(1350,700);x.lineTo(1230,900);x.lineTo(380,900);x.fill();
  x.fillStyle='#f5f1e6';x.fillRect(270,735,1060,34);
  x.fillStyle='#f5f1e6';x.beginPath();x.moveTo(700,690);x.lineTo(700,300);x.lineTo(960,690);x.fill();
  setSource(c);
};
$('go').onclick=()=>{if(src)paint();else msg.textContent='Add an image first.'};
$('save').onclick=()=>{
  if(!painted){msg.textContent='Paint something first.';return}
  out.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='daub-wallpaper.png';a.click()});
};
const labels={brush:v=>v+'×',layers:v=>v,thr:v=>v,sat:v=>v,seed:v=>v,relief:v=>v,light:v=>v+'°',elev:v=>v+'°',spec:v=>v,tex:v=>v};
for(const id in labels){
  const el=$(id),upd=()=>$(id+'v').textContent=labels[id](el.value);
  el.addEventListener('input',upd);upd();
  if(['relief','light','elev','spec','tex'].includes(id))el.addEventListener('input',shadeSoon);
}

// ---- UI layer ----
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function reveal(){ if(window.gsap&&!reduce) gsap.fromTo(out,{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:.9,ease:'power3.inOut',clearProps:'clipPath'}); }
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
  $('style').value=b.dataset.v;
  document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
}));
$('change').onclick=()=>$('file').click();
if(window.gsap&&!reduce){
  const tl=gsap.timeline({defaults:{ease:'power3.out'}});
  tl.from('.brand',{y:-12,opacity:0,duration:.6})
    .from('.hero .l',{yPercent:110,opacity:0,duration:.8,stagger:.12},'-=.3')
    .from('.hero .sm,.hero .tools',{opacity:0,y:10,duration:.5,stagger:.1},'-=.4')
    .from('.group',{x:18,opacity:0,duration:.5,stagger:.07},'-=.8');
}

out.onclick=()=>{const z=out.classList.toggle('zoom');$('stage').classList.toggle('zoom',z)};
$('pick').onclick=()=>$('file').click();
$('size').addEventListener('change',()=>{const v=$('size').value;if(v.includes(',')){const [a,b]=v.split(',');$('w').value=a;$('h').value=b}});
['w','h'].forEach(i=>$(i).addEventListener('input',()=>$('size').value='custom'));
</script>
</body></html>
